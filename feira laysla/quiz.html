<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quiz sobre hiperconectividade e saúde mental: 8 perguntas para testar seus conhecimentos.">
  <title>Quiz | Hiperconectividade e Saúde Mental</title>
  <link rel="stylesheet" href="style.css">
  <script src="quiz.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <a href="index.html" class="logo">Hiper<span>Conexão</span></a>
    <nav aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="roleta.html">Roleta</a>
      <a href="quiz.html" aria-current="page">Quiz</a>
    </nav>
  </header>

  <main>
    <section class="secao quiz-secao pagina-interna" id="quiz">
      <h1 class="titulo-pagina">Quiz interativo</h1>
      <p class="texto-centro">São 8 perguntas, e algumas exigem atenção aos detalhes. Veja quantos pontos você consegue.</p>

      <div class="quiz">
        <div class="quiz-topo">
          <span id="contador">Pergunta 1 de 8</span>
          <span id="pontos">Pontos: 0</span>
        </div>
        <div class="barra-progresso">
          <div id="barraPreenchida"></div>
        </div>

        <div id="areaQuiz">
          <h2 id="pergunta"></h2>
          <div id="respostas" class="respostas"></div>
          <p id="feedback" aria-live="polite"></p>
          <button id="proximo" class="botao" type="button" disabled>Próxima pergunta</button>
        </div>

        <div id="resultado" hidden>
          <h2>Quiz concluído!</h2>
          <p id="mensagemFinal"></p>
          <div class="grupo-botoes centro">
            <button id="reiniciar" class="botao" type="button">Refazer quiz</button>
            <a href="roleta.html" class="botao botao-secundario">Fazer uma pausa na roleta</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>Hiperconectividade e Saúde Mental</p>
    <p>Use a tecnologia com consciência e equilíbrio.</p>
  </footer>
</body>
</html>
